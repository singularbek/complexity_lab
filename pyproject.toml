[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complexity-lab"
version = "0.1.0"
description = "A scientific computing platform and LLM agent environment for complex systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
scientific-lab = "complexity_lab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/complexity_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["complexity_lab"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "unit: Quick unit tests",
    "integration: Multi-component integration tests",
    "scientific: Numerical validity and behavioral tests",
]